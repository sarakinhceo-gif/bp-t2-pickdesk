  <style>
    /* ----- RESET & BASE: Brutalist Ledger ----- */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #191917;
      --secondary: #fafaf7;
      --accent: #c8960c;
      --border-solid: 2px solid #191917;
      --border-double: 4px double #191917;
      --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
      --font-serif: 'Noto Serif KR', 'Times New Roman', serif;
      --gap-lg: 48px;
      --pad-lg: 72px;
      --section-gap: 120px;
      --container-max: 960px;
    }

    html {
      background-color: var(--secondary);
      color: var(--primary);
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-serif);
      line-height: 1.6;
      background: repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(25, 25, 23, 0.04) 30px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TYPOGRAPHY: forced align left, tight spacing */
    h1, h2, h3, h4 {
      font-family: var(--font-serif);
      font-weight: 700;
      text-align: left;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 5.2rem);
      line-height: 1.1;
      border-bottom: 3px solid var(--primary);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    h2 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      border-left: 8px solid var(--accent);
      padding-left: 20px;
      margin: 48px 0 24px;
    }

    h3 {
      font-size: 1.6rem;
      font-weight: 700;
      text-transform: uppercase;
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 6px;
    }

    p, li {
      font-size: 1.1rem;
      font-weight: 400;
      color: #222;
    }

    strong {
      font-weight: 700;
      color: var(--primary);
    }

    .q-wrap-wmd1 {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ----- BRUTALIST RULES & BORDERS ----- */
    hr {
      border: 0;
      border-top: 2px solid var(--primary);
      margin: 48px 0;
    }

    .random-ruled-row {
      border-top: 2px solid var(--primary);
      border-bottom: 2px solid var(--primary);
      padding: 24px 0;
      margin: 36px 0;
    }

    .random-double-rule {
      border-top: 4px double var(--primary);
      border-bottom: 4px double var(--primary);
      padding: 28px 0;
    }

    /* ----- HEADER & NAVIGATION ----- */
    header {
      border-bottom: 3px solid var(--primary);
      background: var(--secondary);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .random-nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      max-width: var(--container-max);
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    .random-logo-text {
      font-family: var(--font-mono);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: var(--primary);
      text-decoration: none;
      border: 2px solid var(--primary);
      padding: 4px 12px;
    }

    .random-nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .random-nav-links a {
      font-family: var(--font-mono);
      font-weight: 500;
      text-decoration: none;
      color: var(--primary);
      border-bottom: 2px solid transparent;
      transition: border-color 0.1s;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .random-nav-links a:hover {
      border-bottom: 2px solid var(--accent);
    }

    .random-hamburger {
      display: none;
      background: none;
      border: 2px solid var(--primary);
      font-size: 2rem;
      cursor: pointer;
      padding: 4px 12px;
      color: var(--primary);
      background: var(--secondary);
    }

    /* ----- HERO (FULL-WIDTH RULED) ----- */
    .random-hero-block {
      border-bottom: 3px solid var(--primary);
      padding: 64px 24px 48px;
      background: var(--secondary);
    }

    .random-hero-grid {
      max-width: var(--container-max);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 48px;
      align-items: end;
    }

    .random-metric-row {
      display: flex;
      gap: 48px;
      border-left: 4px solid var(--accent);
      padding-left: 24px;
    }

    .random-metric-item {
      font-family: var(--font-mono);
      font-size: 1.2rem;
      font-weight: 600;
    }

    .random-metric-item span {
      display: block;
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* ----- SEARCH BAR BRUTAL ----- */
    .random-search-bar {
      display: flex;
      border: 3px solid var(--primary);
      margin: 32px 0 0;
    }

    .random-search-bar input {
      flex: 1;
      padding: 14px 18px;
      border: none;
      font-family: var(--font-mono);
      font-size: 1.2rem;
      background: white;
    }

    .random-search-bar button {
      background: var(--primary);
      color: var(--secondary);
      border: none;
      padding: 0 28px;
      font-family: var(--font-mono);
      font-weight: 700;
      cursor: pointer;
      font-size: 1.1rem;
    }

    /* ----- LEDGER TABLE (PRICE) ----- */
    .random-table-ledger {
      width: 100%;
      border-collapse: collapse;
      margin: 32px 0;
    }

    .random-table-ledger th {
      font-family: var(--font-mono);
      text-transform: uppercase;
      border-top: 4px double var(--primary);
      border-bottom: 3px solid var(--primary);
      padding: 16px 8px;
      text-align: left;
      font-size: 1.1rem;
    }

    .random-table-ledger td {
      border-bottom: 2px solid var(--primary);
      padding: 14px 8px;
      font-family: var(--font-mono);
    }

    /* ----- SIDEBAR BOX ----- */
    .random-stat-box {
      border: 3px solid var(--primary);
      padding: 24px;
      margin: 32px 0;
      background: white;
    }

    /* ----- CATEGORY LIST ----- */
    .random-category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 2px;
      border: 2px solid var(--primary);
      margin: 32px 0;
    }

    .random-cat-item {
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 18px 12px;
      background: var(--secondary);
      border: 1px solid var(--primary);
      text-transform: uppercase;
      transition: background 0.1s;
    }

    .random-cat-item:hover {
      background: var(--accent);
      color: white;
    }

    /* ----- FAQ ----- */
    .random-faq-item {
      border-left: 6px solid var(--accent);
      padding: 24px 28px;
      margin: 28px 0;
      background: white;
    }

    /* ----- AUTHOR BIO ----- */
    .random-author-block {
      border: 3px solid var(--primary);
      padding: 32px;
      display: flex;
      gap: 24px;
      align-items: center;
      margin-top: 48px;
    }

    .random-author-initial {
      font-family: var(--font-mono);
      font-size: 3.5rem;
      font-weight: 700;
      width: 100px;
      text-align: center;
    }

</body>
