    <style>
        :root {

            --bg-secondary: #f3efe8;

            --text-secondary: #4a4540;
            --text-tertiary: #6e6860;
            --accent: #c85a3d;
            --accent-dim: #a84830;
            --border-light: #d9d2c5;
            --border-medium: #bfb7a8;
            --shadow-sm: 0 1px 3px rgba(44, 36, 24, 0.06);
            --shadow-md: 0 4px 12px rgba(44, 36, 24, 0.1);
            --shadow-lg: 0 8px 24px rgba(44, 36, 24, 0.14);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --font-sans: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            --nav-height: 56px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        .site-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(250, 248, 245, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-light);
            padding: 12px 0;
            margin-bottom: 28px;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.5px;
        }

        .logo-text {
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .logo-text span {
            color: var(--accent);
        }

        /* Hamburger Menu */
        .hamburger-menu {
            position: relative;
        }

        .hamburger-toggle {
            display: none;
        }

        .hamburger-label {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px;
            z-index: 101;
        }

        .hamburger-line {
            width: 22px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: all 0.3s ease;
            transform-origin: center;
        }

        .hamburger-toggle:checked+.hamburger-label .hamburger-line:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .hamburger-toggle:checked+.hamburger-label .hamburger-line:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .hamburger-toggle:checked+.hamburger-label .hamburger-line:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .nav-drawer {
            position: absolute;
            top: 44px;
            right: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 16px 20px;
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.25s ease;
            z-index: 10;
        }

        .hamburger-toggle:checked~.nav-drawer {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nav-drawer {
            position: absolute;
            top: 44px;
            right: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 16px 20px;
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: all 0.25s ease;
            z-index: 10;
        }

        .hamburger-toggle:checked~.nav-drawer {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nav-drawer a {
            display: block;
            padding: 10px 0;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid var(--border-light);
            transition: color 0.2s;
            letter-spacing: -0.2px;
        }

        .nav-drawer a:last-child {
            border-bottom: none;
        }

        .nav-drawer a:hover {
            color: var(--accent);
        }

        /* Page Title */
        .page-title-section {
            margin-bottom: 32px;
        }

        .page-label {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            background: rgba(200, 91, 61, 0.08);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .page-title {
            font-family: var(--font-serif);
            font-size: 36px;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.8px;
            color: var(--text-primary);
            margin-bottom: 8px;

        .page-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 400;
            line-height: 1.6;
            max-width: 560px;
        }

        /* Content Cards */
        .content-grid {
            display: flex;
            flex-direction: column;
            gap: 28px;
            margin-bottom: 40px;
        }

        .feature-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            transition: box-shadow 0.25s ease, transform 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .feature-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .card-date {
            font-size: 12px;
            color: var(--text-tertiary);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .card-tag {

            font-weight: 700;

            padding: 4px 10px;
            border-radius: 14px;
            background: rgba(200, 91, 61, 0.1);
            color: var(--accent);

        .card-tag.hot {
            background: rgba(200, 91, 61, 0.18);
            color: var(--accent-dim);
        }

        .card-tag.new {

            line-height: 1.65;

            color: var(--text-tertiary);

        }

            gap: 4px;
        }

            background: #fff;
            border-left: 4px solid var(--accent);
            padding: 20px 22px;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin: 24px 0;
            box-shadow: var(--shadow-sm);
        }

        .insight-block p {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.7;
            margin: 0;
        }

        .insight-block strong {
            color: var(--accent);
        }

        .data-table-wrap {
            overflow-x: auto;
            margin: 24px 0;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 500px;
        }

        .data-table thead th {
            background: var(--bg-tertiary);
            padding: 14px 16px;
            text-align: left;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: -0.2px;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-medium);
        }

        .data-table tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-weight: 400;
        }

        .data-table tbody tr:last-child td {
            border-bottom: none;
        }

        .data-table .trend-up {
            color: #c85a3d;
            font-weight: 600;
        }

        .data-table .trend-down {
            color: #7a6e60;
            font-weight: 600;
        }

        .data-table .trend-stable {

            font-weight: 600;
        }

        .cta-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            font-weight: 600;
            font-size: 15px;

            border-bottom: 1.5px solid transparent;
            transition: border-color 0.2s;
            letter-spacing: -0.2px;
        }

        .cta-link:hover {
            border-bottom-color: var(--accent);
        }

        .cta-link::after {
            content: '→';
            font-size: 16px;
            transition: transform 0.2s;
        }

        .cta-link:hover::after {
            transform: translateX(3px);
        }

        .site-footer {
            border-top: 1px solid var(--border-light);
            padding: 28px 0;
            margin-top: 48px;
            text-align: center;
            font-size: 13px;
            color: var(--text-tertiary);
            letter-spacing: -0.2px;
        }

        .site-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .site-footer a:hover {
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .page-title {
                font-size: 28px;
            }

            .feature-card {
                padding: 20px 16px;
            }

            .card-title {
                font-size: 19px;
            }

            .card-stats {
                flex-wrap: wrap;
                gap: 12px;
            }
